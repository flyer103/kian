# The four gates (AGENTS.md): fmt, build, clippy, test.
#
# Cost policy: a change that compiles nothing (Markdown, docs/, design/,
# site/) cannot break a crate, so a `scope` job classifies the diff first and
# only a code change pays for the workspace sweep (build + clippy + the
# serialized test suite, ~8-11 minutes). A docs-only change still runs the
# docs map — link targets and the crate map stay checked.
#
# The `postgres` job is the only one that needs a live database; it runs on
# PRs and on the weekly schedule, and only when the diff can touch a backend.
#
# Test parallelism note: the whole workspace suite (unit tests plus the
# process-spawning e2e suites in kian-cli, kiand and friends) runs in this
# one job, serialized inside each binary by `--test-threads=1` — see that
# step for why.

name: gates

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # weekly postgres backend coverage (Mondays 02:00 Asia/Shanghai)
    - cron: "0 18 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debuginfo for CI builds. The e2e test binaries are the largest link
  # artifacts in the workspace — one link died on a full runner disk
  # (`ld ... signal 7 [Bus error]`) — and a panic still reports file and line.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Classifies the diff: `code=true` unless every changed path is a document.
  # An unknown base (new branch, absent commit) falls back to the full sweep.
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Classify the diff
        run: |
          set -euo pipefail
          code=true
          base=""
          head=""
          if [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --quiet origin "${{ github.base_ref }}"
            base="origin/${{ github.base_ref }}"
            head="${{ github.sha }}"
          fi
          if [ -n "$base" ] && [ "$base" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$base" "$head")
            echo "changed files:"
            printf '%s\n' "$changed"
            touched=$(printf '%s\n' "$changed" | sed '/^$/d' \
              | grep -vE '^(docs/|design/|site/)|[.]md$|^LICENSE$|^NOTICE$' || true)
            if [ -z "$touched" ]; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  gates:
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # The workspace's debug test binaries no longer fit the hosted
      # runner's default free space: linking `kian-loop`'s lib test died
      # with `ld ... signal 7 [Bus error]`, an mmap write against a full
      # disk. Free the preinstalled toolchains this repo never uses before
      # the cache restore (which also writes into the target dir).
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # A docs-only diff changes no crate: the link and crate-map gate
      # (`cargo test -p kian-cli --test docs_map`) is the whole risk there.
      - name: Docs map (docs-only change)
        if: needs.scope.outputs.code != 'true'
        run: cargo test --locked -p kian-cli --test docs_map
      - name: Build
        if: needs.scope.outputs.code == 'true'
        run: cargo build --workspace --locked
      - name: Clippy
        if: needs.scope.outputs.code == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      # One test at a time *within* a binary: the runner has two cores and a
      # handful of e2e suites pace themselves with short waits (a poll
      # interval, a driver's first cycle). Two concurrent tests on two cores
      # starve those waits, which surfaced as three different flakes on three
      # consecutive runs (a 0-vs-1 frame count, a 2-vs-3 call count, an
      # Elapsed). Deterministic beats fast here; the job still sits well
      # inside its 60-minute budget.
      - name: Test (workspace, serialized)
        if: needs.scope.outputs.code == 'true'
        run: cargo test --workspace --locked -- --test-threads=1
        env:
          NO_PROXY: 127.0.0.1,localhost

  # Postgres surfaces are env-gated (KIAN_PG_URL) and skip — never
  # fail — when the env is absent. This job supplies a real postgres
  # so the gated suites (kian-store, kian-exec, kian-cli postgres_serve
  # and the multi-replica e2e) actually run. PRs exercise a backend
  # change before merge; the weekly schedule catches drift on main
  # without paying the database setup on every push.
  postgres:
    needs: scope
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'schedule')
      && needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: kian
          POSTGRES_DB: kian_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # The gated suites link the same large test binaries as the gates
      # job; keep the same disk bound.
      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/powershell
          sudo apt-get clean
          df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: postgres-gated suites (must run, not skip)
        run: |
          set -euo pipefail
          export KIAN_PG_URL="postgres://kian@localhost:5432/kian_ci"
          export NO_PROXY=127.0.0.1,localhost
          for t in "kian-store --test postgres" "kian-exec --test postgres" \
                   "kian-cli --test postgres_serve" "kian-cli --test postgres_multi_replica"; do
            echo "== cargo test -p $t =="
            # shellcheck disable=SC2086 # $t is a word-split target list by design
            cargo test --locked -p $t -- --test-threads=1 2>&1 | tee /tmp/out.log
            grep -q "test result: ok" /tmp/out.log
            if grep -q "SKIP:" /tmp/out.log; then
              echo "ERROR: gated suite skipped despite KIAN_PG_URL being set" >&2
              exit 1
            fi
          done
