[package]
name = "kian-superagent"
description = "Super-agent bundle: Router/Worker, subscriptions, channels and the declarative job conductor"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# DESIGN §7: `kian-superagent` is the super-agent *bundle* (ADR-003) —
# Router/Worker templates, subscription rules, channel framework. It is
# outside the narrow waist: it depends on the core (seams + concept
# model), on the plugin registry, and on `kian-orchestrator` for *types
# only* (`WakeOutcome`) — every execution capability reaches the bundle
# through the `InboxWriter` port. Assembly (kian-cli)
# implements the port over the real engine. Enforced textually by
# tests/iron_rule.rs.

[dependencies]
kian-core.workspace = true
kian-plugin.workspace = true
kian-orchestrator.workspace = true
# the worker wrapper reuses the evidence gate's public, pure
# evaluation (`evaluate_evidence_gate` / `CheckSpec` / verdict payload)
# instead of duplicating gate semantics. Types + pure functions only —
# no execution surface flows from this edge (iron rule still holds).
kian-loop.workspace = true
tokio.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
# the lark channel adapter dials the Feishu open APIs over HTTP.
# The dependency lives in the bundle (Footprint-Ladder level 2 plugin
# code), never in the core; the crate's iron rule is unaffected (the
# adapter reaches no execution surface).
reqwest.workspace = true
# the dsh mapping contract moved into the bridge crate
# and is re-exported from `kian_superagent::dsh` — types only, the
# bundle never drives the bridge (assembly mounts it config-gated).
kian-dsh.workspace = true
# the policy-version template fingerprints (sha256, display-truncated)
# — pure rendering over prompt bytes, no execution surface.
sha2.workspace = true

[dev-dependencies]
kian-store.workspace = true
kian-llm.workspace = true
tracing-subscriber.workspace = true
# the `run_tickets` CLI surface (kian-cli) is exercised from
# tests/stage_projection.rs over a fixture db. A dev-dependency edge
# crate→assembly is legal (dev-deps may be cyclic); no production edge
# is added — the bundle still never names kian-cli in src/.
kian-cli.workspace = true
# the scripted-HTTP-mock lark tests serve canned Feishu responses
# from an in-process axum server (no credentials, no network).
axum.workspace = true
