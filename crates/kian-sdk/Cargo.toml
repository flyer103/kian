[package]
name = "kian-sdk"
description = "Wire-only embedded SDK for the kian control/ops planes (C13/C14 JSON-RPC + SSE)"
# C46: the SDK carries its own version, decoupled from the workspace bump
# cadence — do NOT switch this to `version.workspace = true`. Publishing to
# crates.io happens only when the owner asks (VC convention).
version = "0.1.0"
edition.workspace = true

# Wire-only dependency set (C46 freeze): nothing beyond this allowlist and
# never a kian crate — the SDK must stay embeddable anywhere. Enforced by
# `tests/wire_only_deps.rs` at the manifest level.
[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
