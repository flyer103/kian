[package]
name = "kian-sdk"
description = "Wire-only embedded SDK for the kian control/ops planes (JSON-RPC + SSE)"
# the SDK carries its own version, decoupled from the workspace bump
# cadence — do NOT switch this to `version.workspace = true`. Publishing to
# crates.io happens only when the owner asks (VC convention).
version = "0.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# Wire-only dependency set (freeze): nothing beyond this allowlist and
# never a kian crate — the SDK must stay embeddable anywhere. Enforced by
# `tests/wire_only_deps.rs` at the manifest level.
[dependencies]
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
futures.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio.workspace = true
