[package]
name = "kian-orchestrator"
description = "Execution model, recovery subsystem (classification + policy + budget), control-plane implementation"
version.workspace = true
edition.workspace = true

# Narrow waist (AGENTS.md constraint 10): this crate depends on kian-core
# and kian-store ONLY. Never add provider/channel/plugin crates here.
[dependencies]
kian-core.workspace = true
kian-store.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
dashmap.workspace = true
serde_yaml.workspace = true
# READ-MODEL §5: the snapshot digest (sha256 over the stored projection
# columns) — a pure hash, no crypto surface beyond it.
sha2.workspace = true

[dev-dependencies]
# wake-transport tests create a throwaway postgres database from
# KIAN_PG_URL before opening the store on it (dev-only; the crate itself
# stays store-agnostic).
sqlx.workspace = true
