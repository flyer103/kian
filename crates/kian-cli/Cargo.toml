edition.workspace = true

[dependencies]
kian-core.workspace = true
kian-store.workspace = true
kian-orchestrator.workspace = true
kian-llm.workspace = true
kian-loop.workspace = true
kian-endpoint.workspace = true
kian-plugin.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
axum.workspace = true
reqwest.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
serde_yaml.workspace = true
kian-superagent.workspace = true
# C54: the S6 dsh bridge mount (worker template, config-gated).
kian-dsh.workspace = true
kian-exec.workspace = true
kian-sdk.workspace = true
# C49 webhook receiver: HMAC-SHA256 over the raw body (sha2 already
