[package]
name = "kian-cli"
description = "CLI and embedded SDK: serve/run/inspect/replay/export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
kian-core.workspace = true
kian-store.workspace = true
kian-orchestrator.workspace = true
kian-llm.workspace = true
kian-loop.workspace = true
kian-endpoint.workspace = true
kian-plugin.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
axum.workspace = true
reqwest.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures.workspace = true
serde_yaml.workspace = true
kian-superagent.workspace = true
# the memory bundle (round 8): the dream prompt, parser and DreamDriver
# the `memory:` section assembles.
kian-memory.workspace = true
# the harness bridges (worker template, config-gated; HARNESS-BRIDGE).
kian-dsh.workspace = true
kian-harness.workspace = true
kian-claude.workspace = true
kian-codex.workspace = true
kian-exec.workspace = true
# the cron scheduling core (CRON-MODEL §2): `superagent.cron`
# declarations parse their expressions and timezones through it.
kian-cron.workspace = true
chrono.workspace = true
kian-sdk.workspace = true
# webhook receiver: HMAC-SHA256 over the raw body (sha2 already
# pinned in the workspace).
sha2.workspace = true
hmac.workspace = true
# the serve binary installs a tracing subscriber (RUST_LOG,
# default warn) so the resident re-arm succession note has an audience.
tracing-subscriber.workspace = true

[dev-dependencies]
uuid.workspace = true
# the rate-limit rejection's audit line is asserted by capturing
# the tracing output in-process (no log file, no flaky greps).
tracing-subscriber.workspace = true
# the read-path benchmark (READ-MODEL P0): unchanged vs changed
# projection reads and SSE tail polls vs full rebuilds.
criterion = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name = "read_path"
harness = false

[[bin]]
name = "kian"
path = "src/main.rs"
