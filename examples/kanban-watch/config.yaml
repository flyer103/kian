# kian serve config — examples/kanban-watch (dogfood round 2)
#
# The kanban-watch dogfood: a TimerChannel ticks the resident Router; the
# Router delegates polling and stage classification to fresh worker
# sessions; everything lands in durable event streams under .state/kian.db.
#
# Credentials are env-only (never in this file):
#   DRY_RUN          — "0" is the ONLY value that lets a worker write to
#                      the watched board (reclaim/unblock/comment);
#                      anything else = dry-run
# The model provider is the LOCAL vadis gateway (127.0.0.1:8290,
# OpenAI-compatible). It accepts any bearer token; KIAN_API_KEY is set to
# a fixed marker purely to satisfy the wire shape — no real secret.
# Board writes happen only through the `hermes kanban` CLI (argv-direct
# exec), never by touching the board's sqlite files.

listen: "127.0.0.1:7461"

# The bundle must be enabled explicitly alongside its config section
# (and `react-loop` is then omitted: the superagent assembly builds the
# loops itself).
plugins: ["openai-compat", "local-tools", "superagent"]

storage:
  sqlite: "./.state/kian.db"

# The default (plain-session) agent — always required by the schema.
# This example never creates plain sessions; it is intentionally minimal.
agent:
  id: default
  model_slots:
    main:
      provider: vadis
      model: coding-fast
  tools: ["fs_read"]

# The bundle's named agent templates.
agents:
  # The resident Router: cheap fast judge slot, dispatch toolset.
  router:
    id: router
    version: 1
    model_slots:
      router:
        provider: vadis
        model: coding-fast
    tools: ["spawn_worker", "reply", "deliver_structured"]
  # The worker template every thread pins: exec toolset (argv-direct,
  # no shell, under tools.exec_timeout_ms).
  stager:
    id: stager
    version: 1
    model_slots:
      main:
        provider: vadis
        model: coding-fast
    tools: ["exec"]

superagent:
  router:
    # The fixed resident Router session. run.sh substitutes the watched
    # board name into the charter and submits it to this id exactly once
    # (idempotency key includes the board name).
    session_id: "00000000-0000-4000-8000-00000000c101"
    agent: router
    slot: router
  worker:
    agent: stager
  # One tick every 60s, topic "kanban". The first tick waits for the
  # interval so run.sh can land the charter first.
  channels:
    kanban-timer:
      type: timer
      timer:
        interval_ms: 60000
        topic: kanban
        emit_on_start: false
  subscriptions:
    - channel: kanban-timer
      match: {topic: kanban}
      route: router
  # Keep the Router's model-visible surface minimal for this demo:
  # dispatch + channel tools only, no recall toolpack.
  recall:
    router: false
    worker: false

# The local vadis gateway, reached DIRECTLY. Wire dialect v2 (kian-61):
# dotless tool names, assistant `tool_calls` with string arguments —
# vadis is a pass-through OpenAI-compatible endpoint and accepts it.
providers:
  vadis:
    base_url: "http://127.0.0.1:8290/v1"
    api_key_env: KIAN_API_KEY

# exec gets a generous timeout because `hermes kanban list/show` round-trips
# the board DB and can be slow on large boards.
tools:
  root: "./.state/tools"
  exec_timeout_ms: 60000

drain:
  max_iterations: 32

# Required, no silent defaults (the C10 rule). Network hiccups on the
# model side back off once; anything unrecognized fails honestly.
recovery:
  rules:
    - class: rate_limited
      action: {backoff_retry: {delay_ms: 2000}}
    - class: unknown
      action: fail
