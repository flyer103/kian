# A runnable `sidecars:` snippet (PLUGIN-SPEC §8.1) for the approval gate.
# Merge into your kian.yaml; the interpreter path and digest must match your
# manifest.toml (see this directory's README).

sidecars:
  plugins:
    approval-gate:                      # the instance key == [plugin].name
      manifest: "/absolute/path/to/examples/hook-approval-gate/manifest.toml"
  scopes:
    server: ["approval-gate"]           # every session — the widest set

# The gate's own configuration rides the environment the manifest allows
# (env_allow is the sidecar's whole environment; everything else is cleared):
#
#   APPROVAL_GATE_SESSIONS="11111111-1111-1111-1111-111111111111"  # approved sessions
#   APPROVAL_GATE_FRAMES="/var/log/kian/approval-gate-frames.log"  # the ABI trail
