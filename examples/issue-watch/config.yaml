# kian serve config — examples/issue-watch (card C60)
#
# The issue-watch dogfood: a TimerChannel ticks the resident Router; the
# Router delegates polling and triage drafting to fresh worker sessions;
# everything lands in durable event streams under .state/kian.db.
#
# Credentials are env-only (never in this file):
#   DEEPSEEK_API_KEY  — the model slot's key (sourced by run.sh)
#   DRY_RUN           — "0" is the ONLY value that lets a worker post a
#                       real GitHub comment; anything else = dry-run
# gh authentication comes from the invoking user's keyring.

listen: "127.0.0.1:7460"

# The bundle must be enabled explicitly alongside its config section
# (and `react-loop` is then omitted: the superagent assembly builds the
# loops itself).
plugins: ["openai-compat", "local-tools", "superagent"]

storage:
  sqlite: "./.state/kian.db"

# The default (plain-session) agent — always required by the schema.
# This example never creates plain sessions; it is intentionally minimal.
# (Tool names are dotless since kian-61: strict OpenAI-compatible
# endpoints reject names outside ^[a-zA-Z0-9_-]+$.)
agent:
  id: default
  model_slots:
    main:
      provider: deepseek
      model: deepseek-chat
  tools: ["fs_read"]

# The bundle's named agent templates.
agents:
  # The resident Router: cheap fast judge slot, dispatch toolset.
  router:
    id: router
    version: 1
    model_slots:
      router:
        provider: deepseek
        model: deepseek-chat
    tools: ["spawn_worker", "reply", "deliver_structured"]
  # The worker template every thread pins: exec toolset (argv-direct,
  # no shell, under tools.exec_timeout_ms). The agent `tools:` list is
  # the mounted surface since kian-61 — the fs tools not listed here
  # never ride the worker's requests (config-filtered, fail-closed).
  triager:
    id: triager
    version: 1
    model_slots:
      main:
        provider: deepseek
        model: deepseek-chat
    tools: ["exec"]

superagent:
  router:
    # The fixed resident Router session. run.sh submits the charter
    # (triage-prompt.md) to this id exactly once (idempotency key).
    session_id: "00000000-0000-4000-8000-00000000c060"
    agent: router
    slot: router
  worker:
    agent: triager
  # The demo cadence: one tick every 30s, topic "issues". The first
  # tick waits for the interval so run.sh can land the charter first.
  channels:
    issue-timer:
      type: timer
      timer:
        interval_ms: 30000
        topic: issues
        emit_on_start: false
  subscriptions:
    - channel: issue-timer
      match: {topic: issues}
      route: router
  # Keep the Router's model-visible surface minimal for this demo:
  # dispatch + channel tools only, no recall toolpack.
  recall:
    router: false
    worker: false

# DeepSeek's OpenAI-compatible endpoint, reached DIRECTLY (no adapter).
# Since kian-61 (wire dialect v2) kian's request serialization is the
# strict openai shape — dotless built-in tool names, assistant
# `tool_calls` with string arguments, tool results carrying
# `tool_call_id` — which strict endpoints accept. The example-scoped
# wire adapter the C60 run needed is gone; see RUNLOG.md.
providers:
  deepseek:
    base_url: "https://api.deepseek.com"
    api_key_env: DEEPSEEK_API_KEY

# exec gets a generous timeout because `gh` round-trips the network.
# (The fs tools stay mounted for plain sessions but the agent `tools:`
# lists above decide what rides each loop's requests.)
tools:
  root: "./.state/tools"
  exec_timeout_ms: 60000

drain:
  max_iterations: 32

# Required, no silent defaults (the C10 rule). Network hiccups on the
# model side back off once; anything unrecognized fails honestly.
recovery:
  rules:
    - class: rate_limited
      action: {backoff_retry: {delay_ms: 2000}}
    - class: unknown
      action: fail
