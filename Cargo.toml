[workspace]
resolver = "3"
members = [
    "crates/kian-core",
    "crates/kian-store",
    "crates/kian-orchestrator",
    "crates/kian-llm",
    "crates/kian-loop",
    "crates/kian-endpoint",
    "crates/kian-exec",
    "crates/kian-plugin",
    "crates/kian-superagent",
    "crates/kian-cli",
    "crates/kiand",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Shared dependencies, pinned once (card C1). Crates opt in with
# `foo.workspace = true`; version bumps happen only here.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
# v5 (C20): remote-exec command ids are derived deterministically from the
# calling tool-call id so session recovery + re-execution dedupes at the
# queue-row level (ADR-007).
uuid = { version = "1", features = ["v4", "v5", "serde"] }
thiserror = "2"
tracing = "0.1"
futures = "0.3"
dashmap = "6"
wiremock = "0.6"
sha2 = "0.10"
serde_yaml = "0.9"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
] }

# Internal crates (DESIGN §7 as landed; kian-sdk is still ahead).
kian-core = { path = "crates/kian-core" }
kian-store = { path = "crates/kian-store" }
kian-orchestrator = { path = "crates/kian-orchestrator" }
kian-llm = { path = "crates/kian-llm" }
kian-loop = { path = "crates/kian-loop" }
kian-endpoint = { path = "crates/kian-endpoint" }
kian-exec = { path = "crates/kian-exec" }
kian-plugin = { path = "crates/kian-plugin" }
kian-superagent = { path = "crates/kian-superagent" }
kian-cli = { path = "crates/kian-cli" }
kiand = { path = "crates/kiand" }

[profile.release]
lto = "thin"
