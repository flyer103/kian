[workspace]
resolver = "3"
members = [
    "crates/kian-core",
    "crates/kian-store",
    "crates/kian-orchestrator",
    "crates/kian-llm",
    "crates/kian-loop",
    "crates/kian-endpoint",
    "crates/kian-plugin",
    "crates/kian-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Shared dependencies, pinned once (card C1). Crates opt in with
# `foo.workspace = true`; version bumps happen only here.
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
futures = "0.3"
dashmap = "6"
wiremock = "0.6"
sha2 = "0.10"
serde_yaml = "0.9"

# Internal crates (Phase-1 subset of DESIGN §7; kian-exec / kian-superagent /
# kian-sdk / kiand are Phase 2+ and deliberately absent).
kian-core = { path = "crates/kian-core" }
kian-store = { path = "crates/kian-store" }
kian-orchestrator = { path = "crates/kian-orchestrator" }
kian-llm = { path = "crates/kian-llm" }
kian-loop = { path = "crates/kian-loop" }
kian-endpoint = { path = "crates/kian-endpoint" }
kian-plugin = { path = "crates/kian-plugin" }
kian-cli = { path = "crates/kian-cli" }

[profile.release]
lto = "thin"
